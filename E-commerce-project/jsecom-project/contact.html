 <!--Start contact section -->

    <div class="section-contact">
        <div class="container">
            <h2 class="section-common-heading" data-aos="fade-right">Contact Us</h2>
            <p class="section-common-subheading"  data-aos="fade-left">Get in touch with us. We are always here to help you.</p>
        </div>
    

         <div class="container grid grid-two--cols ">
             <div class="contact-content" data-aos="fade-up">

            <form action="https://formspree.io/f/xrbkbqpa"
  method="POST">
                <div class="grid grid-two--cols mb-3">
                    <div>
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username"required placeholder="Enter your username" autocomplete="off">
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="abc@gmail.com" autocomplete="off" >
                    </div>
                   </div> 

                    <div class="mb-3">
                        <label for="suject">Subject</label>
                        <input type="text" id="subject" name="subject" required placeholder="Enter your subject" autocomplete="off">
                    </div>


                    <div class="mb-3">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="10" cols="30" placeholder="Type your message here..."></textarea>
                </div>
                    <div>
                        <button type="submit" class="btn btn-submit">Submit</button>
                    </div>
                
            </form>
            </div>
            <div class="contact-map" data-aos="fade-down">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d435521.95374960464!2d74.00472881897436!3d31.48251797235109!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39190483e58107d9%3A0xc23abe6ccc7e2462!2sLahore%2C%20Pakistan!5e0!3m2!1sen!2s!4v1749055149670!5m2!1sen!2s" width="100%" height="450px" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            </div>
        </div>
    </div>

     <!--End contact section -->
