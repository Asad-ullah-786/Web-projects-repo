<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="image-container">
        <span style="--i: 1">
            <img src="https://picsum.dev/static/23/400/300">
        </span>
        <span style="--i: 2">
            <img src="https://picsum.dev/static/44/400/300">
        </span>
        <span style="--i: 3">
            <img src="https://picsum.dev/static/85/400/300">
        </span>
        <span style="--i: 4">
            <img src="https://picsum.dev/static/66/400/300">
        </span>
        <span style="--i: 5">
            <img src="https://picsum.dev/static/27/400/300">
        </span>
        <span style="--i: 6">
            <img src="https://picsum.dev/static/78/400/300">
        </span>
        <span style="--i: 7">
            <img src="https://picsum.dev/static/59/400/300">
        </span>
        <span style="--i: 8">
            <img src="https://picsum.dev/static/80/400/300">
        </span>
    </div>
    <div class="btn-container">
        <button class="btn" id="prev">Previous</button>
        <button class="btn" id="next">Next</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
