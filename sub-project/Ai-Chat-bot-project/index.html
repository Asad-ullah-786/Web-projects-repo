<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroX 2.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-container">
      
      <div class="ai-chat-box">
        <img
          src="chatBot.webp"
          alt=""
          id="aiImage"
          width="10%"
    
        />
        <div class="ai-chat-area">
         ✨ Greetings! I’m NeuroX, an advanced AI created by Asad Ullah. ✨<br>How can I assist you today?
   
        </div>
        
      </div>
    </div>
    <div class="prompt-area">
      <input type="text" placeholder="Type your message..." id="prompt" />
      <button id="image"><img src="img.svg" alt="" />
        <input type="file" accept="images/*" hidden>
    </button>
      <button id="submit"><img src="submit.svg" alt="" /></button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
