<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color changer</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body><div  class="container">
    <h1 class="heading">Color Changer</h1>
    <div class="maindiv">
        <button class="randombtn">Random Color</button>
        <input id="colorinput" type="text" placeholder="Enter color name or hex code">
        <button class="applybtn">Apply Color</button>
       
    </div>
     <p  class="currentcolor">Current Color: <span class="currentcolorvalue">bisque</span></p>
    </div>


    <script src="index.js"></script>
</body>
</html>
